<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#111e38" />
    </linearGradient>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="redArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f87171" />
    </marker>
    <marker id="floodArrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="320" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title banner -->
  <text x="380" y="32" text-anchor="middle" fill="#38bdf8" font-size="16" font-family="sans-serif" font-weight="700" letter-spacing="1">NETWORK ATTACK ARCHITECTURE DIAGRAM</text>

  <!-- System 1 (Top Left) -->
  <g transform="translate(40, 55)">
    <rect width="160" height="52" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="10" y="10" width="32" height="32" rx="4" fill="url(#compGrad)"/>
    <!-- Screen icon -->
    <path d="M16 18 h20 v14 h-20 z M23 32 v4 h6 v-4" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="52" y="27" fill="#fca5a5" font-size="11" font-family="sans-serif" font-weight="700">Compromised</text>
    <text x="52" y="42" fill="#94a3b8" font-size="11" font-family="sans-serif">System 1 (Bot)</text>
  </g>

  <!-- System 2 (Mid Left) -->
  <g transform="translate(40, 134)">
    <rect width="160" height="52" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="10" y="10" width="32" height="32" rx="4" fill="url(#compGrad)"/>
    <path d="M16 18 h20 v14 h-20 z M23 32 v4 h6 v-4" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="52" y="27" fill="#fca5a5" font-size="11" font-family="sans-serif" font-weight="700">Compromised</text>
    <text x="52" y="42" fill="#94a3b8" font-size="11" font-family="sans-serif">System 2 (Bot)</text>
  </g>

  <!-- System 3 (Bottom Left) -->
  <g transform="translate(40, 213)">
    <rect width="160" height="52" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="10" y="10" width="32" height="32" rx="4" fill="url(#compGrad)"/>
    <path d="M16 18 h20 v14 h-20 z M23 32 v4 h6 v-4" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="52" y="27" fill="#fca5a5" font-size="11" font-family="sans-serif" font-weight="700">Compromised</text>
    <text x="52" y="42" fill="#94a3b8" font-size="11" font-family="sans-serif">System 3 (Bot)</text>
  </g>

  <!-- Central Cloud: Internet -->
  <g transform="translate(290, 85)">
    <!-- Cloud Path -->
    <path d="M 50 80 
             A 35 35 0 0 1 80 30 
             A 45 45 0 0 1 150 25 
             A 40 40 0 0 1 190 70 
             A 35 35 0 0 1 180 120 
             A 40 40 0 0 1 50 115 
             Z" 
          fill="url(#cloudGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <text x="120" y="80" text-anchor="middle" fill="#ffffff" font-size="16" font-family="sans-serif" font-weight="700">The Internet</text>
    <text x="120" y="98" text-anchor="middle" fill="#bae6fd" font-size="11" font-family="sans-serif">Public Network</text>
  </g>

  <!-- Target Server (Right) -->
  <g transform="translate(560, 95)">
    <rect width="160" height="130" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <!-- Server racks -->
    <rect x="20" y="20" width="120" height="24" rx="4" fill="#0f172a" stroke="#475569"/>
    <circle cx="32" cy="32" r="3" fill="#10b981"/>
    <circle cx="42" cy="32" r="3" fill="#10b981"/>
    <line x1="60" y1="32" x2="125" y2="32" stroke="#475569" stroke-width="2" stroke-dasharray="3,3"/>

    <rect x="20" y="52" width="120" height="24" rx="4" fill="#0f172a" stroke="#475569"/>
    <circle cx="32" cy="64" r="3" fill="#ef4444"/>
    <circle cx="42" cy="64" r="3" fill="#f59e0b"/>
    <line x1="60" y1="64" x2="125" y2="64" stroke="#475569" stroke-width="2" stroke-dasharray="3,3"/>

    <rect x="20" y="84" width="120" height="24" rx="4" fill="#0f172a" stroke="#475569"/>
    <circle cx="32" cy="96" r="3" fill="#ef4444"/>
    <circle cx="42" cy="96" r="3" fill="#ef4444"/>
    <line x1="60" y1="96" x2="125" y2="96" stroke="#475569" stroke-width="2" stroke-dasharray="3,3"/>

    <text x="80" y="122" text-anchor="middle" fill="#f87171" font-size="12" font-family="sans-serif" font-weight="700">TARGET SERVER (VICTIM)</text>
  </g>

  <!-- Connection Arrows: Bots -> Internet -->
  <path d="M 200 81 Q 255 81 295 110" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#redArrow)"/>
  <path d="M 200 160 Q 255 160 295 150" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#redArrow)"/>
  <path d="M 200 239 Q 255 239 295 190" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#redArrow)"/>

  <!-- Flood Arrows: Internet -> Target -->
  <path d="M 480 135 L 550 135" fill="none" stroke="#ef4444" stroke-width="5" marker-end="url(#floodArrow)"/>
  <path d="M 480 155 L 550 155" fill="none" stroke="#ef4444" stroke-width="5" marker-end="url(#floodArrow)"/>
  <path d="M 480 175 L 550 175" fill="none" stroke="#ef4444" stroke-width="5" marker-end="url(#floodArrow)"/>

  <!-- Flood Banner -->
  <rect x="475" y="100" width="75" height="20" rx="4" fill="#ef4444"/>
  <text x="512" y="114" text-anchor="middle" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="bold">FLOOD</text>
  <text x="380" y="285" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="sans-serif">Coordinated attack traffic originating from multiple compromised devices overwhelm the target server</text>
</svg>
